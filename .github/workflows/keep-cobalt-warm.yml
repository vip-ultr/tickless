name: keep-cobalt-warm

# Render free-tier services spin down after ~15 minutes idle. The Tickless
# backend CANNOT wake the separate tickless-cobalt service itself: Render
# routes service-to-service calls internally, straight to the stopped
# container, which refuses the connection instantly instead of going through
# the public proxy that boots it. Measured: warm backend + cold Cobalt =
# HTTP 502 after 68s, with Cobalt never booting. An EXTERNAL request goes
# through the wake proxy and boots it in ~23s, which is why a manual redeploy
# (or any direct visit) "fixes" it.
#
# So the wake-up must come from outside Render. This pings Cobalt every 10
# minutes during active hours only.
#
# Free-hours budget: Render gives 750 instance-hours/month for the whole
# account, shared with the `tickless` backend. Pinging 24/7 would burn ~730h
# and starve the backend. This window is 08:00-22:00 UTC (09:00-23:00 WAT),
# 14h/day, about 420h/month, leaving room for the backend.
# Outside the window Cobalt may be cold and the first Instagram request will
# be slow or fail; the backend returns a clear "warming up" message and the
# frontend retries once.

on:
  schedule:
    - cron: "*/10 8-21 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wake Cobalt
        run: |
          # -m 120: a cold boot takes ~23s, and the request must be HELD open
          # for the whole boot. Do not shorten this below the boot time.
          code=$(curl -s -o /tmp/body -m 120 -w '%{http_code}' \
            https://tickless-cobalt.onrender.com/)
          echo "HTTP $code"
          head -c 300 /tmp/body || true
          echo
          # A 200 means Cobalt is up and serving. Anything else is a real
          # problem worth failing the job for (visible in the Actions tab).
          test "$code" = "200"

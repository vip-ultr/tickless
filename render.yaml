# Render blueprint for the Cobalt service.
#
# Setup in Render dashboard:
#   New + -> Blueprint -> Connect repo vip-ultr/tickless
#   Render will detect render.yaml and create:
#     tickless-cobalt  (Docker service from ./cobalt)
#     tickless         (existing Python service from backend/)
#
# If Render auto-creates a service with root Directory "/",
# edit it and set Dockerfile Path to: cobalt/Dockerfile
# and Build Context to: cobalt
#
services:
  - type: docker
    name: tickless-cobalt
    dockerfilePath: cobalt/Dockerfile
    dockerContext: cobalt
    plan: free
    branch: main
    envVars:
      - key: API_URL
        value: https://tickless-cobalt.onrender.com/
      - key: PORT
        value: 9000
